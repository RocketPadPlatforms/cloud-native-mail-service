# Minimal ServiceMonitor CRD for envtest (PROMETHEUS_CRDS=1).
# The real CRD comes from the Prometheus Operator; this file only
# needs the API group/kind registered so the optional integration
# (ADR 0005) can be exercised. The schema is intentionally permissive.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    listKind: ServiceMonitorList
    plural: servicemonitors
    singular: servicemonitor
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
