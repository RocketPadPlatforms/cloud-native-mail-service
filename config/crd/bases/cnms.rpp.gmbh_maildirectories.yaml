---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: maildirectories.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailDirectory
    listKind: MailDirectoryList
    plural: maildirectories
    singular: maildirectory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailDirectory is the Schema for the cnms mail directories.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailDirectory
            properties:
              ldap:
                description: LDAP settings. Required when type is "ldap".
                properties:
                  baseDN:
                    description: Base DN for user searches.
                    maxLength: 256
                    type: string
                  bindDN:
                    description: Bind DN used for searches. Empty means an anonymous
                      bind.
                    maxLength: 256
                    nullable: true
                    type: string
                  bindSecretRef:
                    description: |-
                      Secret with the bind password (key "password"). Required when
                      bindDN is set.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  host:
                    description: Server host.
                    maxLength: 253
                    type: string
                  port:
                    description: |-
                      Server port. Unset means the operator picks 389, or 636 when
                      tls.mode is LDAPS.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  tls:
                    description: Transport security. Defaults to StartTLS with verification.
                    properties:
                      caSecretRef:
                        description: |-
                          CASSecretRef references a Secret with the CA bundle (key
                          "ca.crt") used to verify the server certificate.
                        properties:
                          name:
                            description: Name of the Secret.
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      mode:
                        default: StartTLS
                        description: |-
                          Mode of the connection: "StartTLS" upgrades an existing
                          connection (default), "LDAPS" connects directly over TLS, "None"
                          disables transport security. With "None", bindDN must not be
                          set (cleartext bind).
                        enum:
                        - StartTLS
                        - LDAPS
                        - None
                        type: string
                    type: object
                  userFilter:
                    description: |-
                      Search filter for users; %s is replaced with the user's mail
                      address. Defaults to "(mail=%s)".
                    maxLength: 256
                    type: string
                required:
                - baseDN
                - host
                type: object
                x-kubernetes-validations:
                - message: bindSecretRef is required when bindDN is set
                  rule: '!has(self.bindDN) || has(self.bindSecretRef)'
                - message: bindDN must not be set when tls.mode is None (cleartext
                    bind)
                  rule: '!has(self.bindDN) || !has(self.tls) || !has(self.tls.mode)
                    || self.tls.mode != ''None'''
              sql:
                description: SQL settings. Required when type is "sql".
                properties:
                  database:
                    description: Database name.
                    maxLength: 63
                    type: string
                  host:
                    description: Server host.
                    maxLength: 253
                    type: string
                  passwordSecretRef:
                    description: Secret with the database password (key "password").
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  port:
                    default: 5432
                    description: Server port. Defaults to 5432.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  tls:
                    description: Transport security. Defaults to verify-full.
                    properties:
                      caSecretRef:
                        description: |-
                          CASSecretRef references a Secret with the CA bundle (key
                          "ca.crt") used to verify the server certificate.
                        properties:
                          name:
                            description: Name of the Secret.
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      mode:
                        default: verify-full
                        description: |-
                          Mode of the connection: "verify-full" encrypts and verifies the
                          host name (default), "require" encrypts without host name
                          verification, "disable" sends cleartext.
                        enum:
                        - verify-full
                        - require
                        - disable
                        type: string
                    type: object
                  username:
                    description: Database user.
                    maxLength: 63
                    type: string
                required:
                - database
                - host
                - passwordSecretRef
                - username
                type: object
              type:
                description: Directory type.
                enum:
                - ldap
                - sql
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: exactly one of ldap or sql must be set and must match type
              rule: has(self.ldap) != has(self.sql) && ((self.type == 'ldap' && has(self.ldap))
                || (self.type == 'sql' && has(self.sql)))
          status:
            description: status defines the observed state of the MailDirectory
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the MailDirectory.
                  The "Ready" condition is true when the directory is reachable
                  and answers queries.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
