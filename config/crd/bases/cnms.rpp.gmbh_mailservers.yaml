---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mailservers.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailServer
    listKind: MailServerList
    plural: mailservers
    singular: mailserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hostname
      name: Hostname
      type: string
    - description: Relay of the relay outbound mode; empty for direct delivery
      jsonPath: .spec.outbound.relay.relayRef.name
      name: Relay
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailServer is the Schema for the cnms mail servers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailServer
            properties:
              availability:
                description: Availability settings (disruption budget, topology spread).
                properties:
                  postfixMinAvailable:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1
                    description: |-
                      Minimum available Postfix replicas (PodDisruptionBudget).
                      Defaults to 1. An integer or a percentage such as "50%"; a
                      string without "%" is rejected by the PodDisruptionBudget
                      validation, so it is rejected here as well.
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be a non-negative integer or a percentage such
                        as 50%
                      rule: 'type(self) == int ? self >= 0 : self.matches(''^(100|[1-9]?[0-9])%$'')'
                  topologySpread:
                    description: Topology spread constraints for mail server pods.
                    properties:
                      maxSkew:
                        default: 1
                        description: Maximum allowed skew between topology domains.
                          Defaults to 1.
                        format: int32
                        minimum: 1
                        type: integer
                      topologyKey:
                        default: kubernetes.io/hostname
                        description: |-
                          Topology key, a label key such as "topology.kubernetes.io/zone".
                          Defaults to kubernetes.io/hostname.
                        maxLength: 317
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$
                        type: string
                    type: object
                type: object
              backup:
                description: Backup settings (k8up annotations on the managed volumes).
                properties:
                  enabled:
                    default: true
                    description: |-
                      Annotate the managed PersistentVolumeClaims for k8up
                      (k8up.io/backup): the Dovecot mail volume is included, the
                      Postfix queue volumes and the Valkey volume are excluded.
                      Kubernetes cannot change the claim templates of an existing
                      StatefulSet, so the annotation reaches the Postfix and Dovecot
                      volumes created after the StatefulSet. Defaults to true.
                    type: boolean
                type: object
              directoryRef:
                description: |-
                  Directory used for recipient validation and user authentication.
                  References a MailDirectory in the same namespace. Optional: a
                  server without a directory needs another user source, which is
                  MailUser accounts (ADR 0008, not implemented yet) or, for tests,
                  submission.insecureStaticUsers. Without any user source the
                  server is not Ready (reason NoUserSource).
                properties:
                  name:
                    description: Name of the referenced resource.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              hostname:
                description: |-
                  Hostname is the name the server presents: Postfix myhostname and
                  HELO, the name of the certificate, the target of the MX records
                  of its domains and the mx host of their MTA-STS policies (ADR
                  0014). Lowercase DNS name with at least two labels of up to 63
                  characters (A-labels only, no trailing dot); the last label
                  starts with a letter. The same rule applies to
                  MailDomain.spec.domain and the name of a MailDomainGrant; keep
                  the three patterns in sync. The hostname is authorized like a
                  domain: a MailDomainGrant has to cover it for the namespace, it
                  must not be a public suffix, and no other MailServer may use it.
                  Without that the server presents the in-cluster name of its
                  Postfix Service instead and keeps serving its domains
                  (HostnameAuthorized is False). Mutable, but a rename is treated
                  like a revocation of the old name. Point an A and an AAAA record
                  at the inbound address; status.records lists them.
                maxLength: 253
                pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              inbound:
                description: Inbound mail (port 25) service settings.
                properties:
                  externalTrafficPolicy:
                    default: Local
                    description: |-
                      externalTrafficPolicy of the inbound service. Defaults to Local
                      so that client addresses are preserved for postscreen and
                      rate limiting. Only used with serviceType LoadBalancer; it is
                      ignored (not rejected, because the default is always present)
                      with ClusterIP.
                    enum:
                    - Local
                    - Cluster
                    type: string
                  serviceType:
                    default: LoadBalancer
                    description: |-
                      Service type for inbound mail. Defaults to LoadBalancer. With
                      ClusterIP the service is not reachable from outside the cluster
                      and externalTrafficPolicy has no effect.
                    enum:
                    - LoadBalancer
                    - ClusterIP
                    type: string
                type: object
              mailboxes:
                description: |-
                  Mailboxes configures Dovecot mail storage (IMAP, LMTP delivery).
                  When disabled while submission is enabled, Dovecot runs in
                  auth-only mode.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enable mail storage (IMAP access, LMTP delivery). Defaults to
                      false.
                    type: boolean
                  quota:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Per-user quota. Unset means no quota.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be greater than zero
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                  storage:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Gi
                    description: |-
                      Size of the mail storage volume. Defaults to 10Gi. Immutable
                      once set: the volume claim template of a StatefulSet cannot
                      change, and existing volumes are resized manually (ADR 0010).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be greater than zero
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                    - message: storage is immutable; resize the PersistentVolumeClaim
                        manually
                      rule: self == oldSelf
                type: object
              observability:
                description: Observability settings.
                properties:
                  prometheusOperator:
                    default: auto
                    description: |-
                      Create Prometheus Operator ServiceMonitors: "auto" creates them
                      when the CRDs are present, "enabled" requires them, "disabled"
                      never creates them. Defaults to auto.
                    enum:
                    - auto
                    - enabled
                    - disabled
                    type: string
                type: object
              outbound:
                description: Outbound selects the outbound delivery mode.
                properties:
                  direct:
                    description: |-
                      Deliver directly from the mail server's own sending addresses
                      (reputation is tied to those addresses).
                    properties:
                      ipPoolClaimRef:
                        description: |-
                          Reference to a MailIPPoolClaim providing the sending addresses.
                          Optional: without a claim, mail leaves via the pods' source
                          addresses.
                        properties:
                          name:
                            description: Name of the referenced resource.
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  relay:
                    description: Deliver via a smart host.
                    properties:
                      relayRef:
                        description: Reference to a MailRelay in the same namespace.
                        properties:
                          name:
                            description: Name of the referenced resource.
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - relayRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of direct or relay must be set
                  rule: has(self.direct) != has(self.relay)
              postfix:
                description: Postfix workload settings.
                properties:
                  queueStorage:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1Gi
                    description: |-
                      Size of the per-replica queue volume. Defaults to 1Gi. Immutable
                      once set: the volume claim template of a StatefulSet cannot
                      change, and existing volumes are resized manually (ADR 0010).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be greater than zero
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                    - message: queueStorage is immutable; resize the PersistentVolumeClaims
                        manually
                      rule: self == oldSelf
                  replicas:
                    default: 2
                    description: |-
                      Number of replicas. Each replica runs with its own queue
                      volume. Defaults to 2.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
              rspamd:
                description: Rspamd workload settings.
                properties:
                  replicas:
                    default: 2
                    description: Number of replicas. Defaults to 2.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
              spf:
                description: |-
                  SPF lists the sending sources of the server. The sources are
                  added to the SPF record of every domain the server serves and
                  form the SPF record of the hostname (the HELO identity, ADR
                  0014). The SPF record of a domain lists these sources and the
                  ones of its own spec.spf.
                properties:
                  ip4:
                    description: |-
                      IPv4 addresses or CIDR ranges allowed to send for the server
                      (ip4: mechanisms).
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: every entry must be an IPv4 address or CIDR
                      rule: self.all(a, (isIP(a) && ip(a).family() == 4) || (isCIDR(a)
                        && cidr(a).ip().family() == 4))
                  ip6:
                    description: |-
                      IPv6 addresses or CIDR ranges allowed to send for the server
                      (ip6: mechanisms).
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: every entry must be an IPv6 address or CIDR
                      rule: self.all(a, (isIP(a) && ip(a).family() == 6) || (isCIDR(a)
                        && cidr(a).ip().family() == 6))
                type: object
              submission:
                description: Submission (port 587) settings.
                properties:
                  enabled:
                    default: true
                    description: Enable submission. Defaults to true.
                    type: boolean
                  insecureStaticUsers:
                    description: |-
                      InsecureStaticUsers provides test users from a Secret instead
                      of the MailDirectory for authentication (Phase 2 test source).
                      The Secret must contain the key "users.yaml" with password
                      hashes, never plaintext passwords. The operator only accepts it
                      when started with --enable-insecure-test-features.
                    properties:
                      secretName:
                        description: Name of the Secret in the same namespace.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - secretName
                    type: object
                type: object
              tls:
                description: |-
                  TLS for inbound, submission and outbound mail. The certificate
                  is managed by cert-manager from the referenced issuer.
                properties:
                  issuerRef:
                    description: Issuer used to request the certificate.
                    properties:
                      kind:
                        description: Kind of the issuer.
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: Name of the issuer.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  secretName:
                    description: |-
                      Name of the Secret the certificate is written to. Defaults to
                      `"<name>-tls"`.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - issuerRef
                type: object
              valkey:
                description: Valkey (Rspamd state) settings.
                properties:
                  persistence:
                    default: false
                    description: |-
                      Persist Valkey data (Bayes, fuzzy and rate-limit state).
                      Defaults to false.
                    type: boolean
                  storage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Size of the persistence volume. Required when persistence is
                      enabled.
                    nullable: true
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be greater than zero
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                type: object
                x-kubernetes-validations:
                - message: storage is required when persistence is enabled
                  rule: '!has(self.persistence) || !self.persistence || has(self.storage)'
                - message: storage is only used when persistence is enabled
                  rule: '!has(self.storage) || (has(self.persistence) && self.persistence)'
            required:
            - hostname
            - outbound
            - tls
            type: object
            x-kubernetes-validations:
            - message: decreasing postfix.replicas is not supported yet; the queue
                move is not implemented
              rule: '(has(self.postfix) && has(self.postfix.replicas) ? self.postfix.replicas
                : 2) >= (has(oldSelf.postfix) && has(oldSelf.postfix.replicas) ? oldSelf.postfix.replicas
                : 2)'
          status:
            description: status defines the observed state of the MailServer
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the MailServer. The
                  "Ready" condition is true when all managed workloads are
                  running with validated configuration.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              domains:
                description: |-
                  Domains lists the MailDomains of the namespace that reference
                  this MailServer in spec.serverRef: those that are not served
                  first, then by name, at most 128 entries (the DomainsListed
                  condition says when the list is cut). It is derived from the
                  MailDomains and holds no state of its own.
                items:
                  description: |-
                    ServerDomainStatus reports one MailDomain that references the
                    MailServer.
                  properties:
                    domain:
                      description: Domain is the domain name of the MailDomain (spec.domain).
                      maxLength: 253
                      type: string
                    name:
                      description: Name of the MailDomain object.
                      maxLength: 253
                      type: string
                    reason:
                      description: |-
                        Reason why the domain is served or not (a reason of the
                        DomainsAuthorized condition, or the reason that blocks the
                        whole server).
                      maxLength: 128
                      type: string
                    served:
                      description: |-
                        Served is true when the domain is authorized and part of the
                        configuration the operator renders for the server. Whether the
                        pods already run it is reported by the WorkloadsReady condition.
                      type: boolean
                  required:
                  - domain
                  - name
                  - reason
                  - served
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
              records:
                description: |-
                  Records lists the DNS records of the hostname and whether a
                  lookup verified them: an A or AAAA record for every address of
                  the inbound LoadBalancer Service, and the SPF record of the
                  hostname from spec.spf (omitted while a MailDomain of the
                  hostname itself carries it). The records are reported and
                  verified, not published, and the verification never feeds into
                  Ready. Empty while the hostname is not authorized. The list is
                  atomic: one name holds several records of the same type.
                items:
                  description: |-
                    DNSRecord is the desired state of one DNS record and its
                    verification state.
                  properties:
                    lastChecked:
                      description: LastChecked is the time of the last lookup.
                      format: date-time
                      type: string
                    name:
                      description: Fully qualified record name, e.g. "_dmarc.example.org".
                      maxLength: 253
                      type: string
                    type:
                      description: Record type (TXT, A, ...).
                      maxLength: 10
                      type: string
                    value:
                      description: Expected record value (full string for TXT records).
                      type: string
                    verified:
                      description: |-
                        Verified is true when the last lookup matched the expected
                        value.
                      type: boolean
                  required:
                  - name
                  - type
                  - value
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the MailServer name must be at most 44 characters so that the generated
            object names stay within 63 characters
          rule: size(self.metadata.name) <= 44
    served: true
    storage: true
    subresources:
      status: {}
