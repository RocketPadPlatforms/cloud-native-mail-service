---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: mailusers.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailUser
    listKind: MailUserList
    plural: mailusers
    singular: mailuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailUser is the Schema for the cnms mail users.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailUser
            properties:
              aliases:
                description: |-
                  Aliases are further addresses that deliver into the mailbox of
                  the account and that the account may send as. Aliases are not
                  login names. At most 32.
                items:
                  description: MailUserAlias is one alias address of a MailUser.
                  properties:
                    domainRef:
                      description: |-
                        DomainRef references the MailDomain in the same namespace of the
                        address. The domain must be served by the same server as the
                        account and authorized for it; an alias that fails a check is
                        dropped and reported in status.addresses.
                      properties:
                        name:
                          description: Name of the referenced resource.
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - name
                      type: object
                    localPart:
                      description: |-
                        LocalPart of the address: lower-case ASCII letters, digits and
                        "." "_" "-", starting and ending with a letter or digit, no
                        "..". No "+": plus-addressing is not supported.
                      maxLength: 64
                      pattern: ^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: localPart must not contain two consecutive dots
                        rule: '!self.contains(''..'')'
                  required:
                  - domainRef
                  - localPart
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: 'aliases must be unique: a local part and domain may appear
                    only once'
                  rule: self.all(a, self.exists_one(b, b.localPart == a.localPart
                    && b.domainRef.name == a.domainRef.name))
              disabled:
                default: false
                description: |-
                  Disabled removes the login and the right to send. Inbound mail
                  keeps being delivered to the mailbox. Defaults to false.
                type: boolean
              domainRef:
                description: |-
                  DomainRef references the MailDomain in the same namespace of the
                  primary address, `<name>@<domain>`. The domain must be served by
                  the same server as the account and authorized for it; the
                  controller checks both, CEL cannot.
                properties:
                  name:
                    description: Name of the referenced resource.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              passwordSecretRef:
                description: |-
                  PasswordSecretRef references a Secret in the same namespace with
                  the plaintext password under the key "password" (at least 12
                  characters). Unset means the operator generates a password and
                  keeps it in the credential Secret of the account. A generated
                  password is lost with the credential Secret; in production use a
                  Secret from GitOps or an external secret store.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              serverRef:
                description: |-
                  ServerRef references the MailServer in the same namespace that
                  hosts the account. The server need not exist yet.
                properties:
                  name:
                    description: Name of the referenced resource.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - domainRef
            - serverRef
            type: object
          status:
            description: status defines the observed state of the MailUser
            properties:
              address:
                description: |-
                  Address is the canonical (primary) address, `<name>@<domain>`.
                  Unset while the domain is not resolved.
                maxLength: 318
                type: string
              addresses:
                description: |-
                  Addresses lists the primary address and every alias with the
                  outcome of each, at most 33 entries.
                items:
                  description: MailUserAddressStatus is the outcome for one address
                    of a MailUser.
                  properties:
                    address:
                      description: Address is `<local part>@<domain>`, lower case.
                      maxLength: 318
                      type: string
                    kind:
                      description: 'Kind of the address: the primary address or an
                        alias.'
                      enum:
                      - primary
                      - alias
                      type: string
                    reason:
                      description: |-
                        Reason is Served, or why the address is not: AliasDomainNotFound,
                        AliasDomainNotServed, AliasDomainNotAuthorized or AddressConflict.
                        On the primary address, and on an alias of a suspended account, it
                        is the cause on the primary domain: DomainNotFound, DomainNotServed
                        or DomainNotAuthorized.
                      maxLength: 64
                      type: string
                    served:
                      description: |-
                        Served is true when mail for the address is accepted and the
                        account may send as it.
                      type: boolean
                  required:
                  - address
                  - kind
                  - reason
                  - served
                  type: object
                maxItems: 33
                type: array
                x-kubernetes-list-map-keys:
                - address
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions represent the current state of the MailUser. The
                  "Ready" condition is true when the account works.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialRevision:
                description: |-
                  CredentialRevision is the resourceVersion of the credential
                  Secret after the last write that changed the password hash. It
                  is not secret; its change tells the MailServer to pick up the
                  new hash.
                maxLength: 253
                type: string
              credentialSecretName:
                description: |-
                  CredentialSecretName is the name of the Secret with the
                  operator-owned credential of the account.
                maxLength: 253
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the MailUser name must be at most 64 characters (the local-part
            limit of RFC 5321)
          rule: size(self.metadata.name) <= 64
        - message: names that start with 'sa.' are reserved for service accounts
          rule: '!self.metadata.name.startsWith(''sa.'')'
        - message: an alias must not be the primary address
          rule: '!has(self.spec.aliases) || !self.spec.aliases.exists(a, a.localPart
            == self.metadata.name && a.domainRef.name == self.spec.domainRef.name)'
    served: true
    storage: true
    subresources:
      status: {}
