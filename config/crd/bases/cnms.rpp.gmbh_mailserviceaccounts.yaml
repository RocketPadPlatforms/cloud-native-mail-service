---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: mailserviceaccounts.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailServiceAccount
    listKind: MailServiceAccountList
    plural: mailserviceaccounts
    singular: mailserviceaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sender
      name: Sender
      type: string
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .spec.serverRef.namespace
      name: Server Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailServiceAccount is the Schema for the cnms mail service accounts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailServiceAccount
            properties:
              sender:
                description: |-
                  Sender is the single address the application may send as:
                  `<local part>@<domain>`, lower case. The local part holds
                  lower-case ASCII letters, digits and "." "_" "-", starts and ends
                  with a letter or digit, has no ".." and is at most 64 characters
                  (no "+": plus-addressing is not supported). The domain follows
                  the rule of MailDomain.spec.domain and must be served by the
                  server and authorized for it; the controller checks both, CEL
                  cannot.
                maxLength: 318
                pattern: ^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?@([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: sender must not contain two consecutive dots
                  rule: '!self.contains(''..'')'
                - message: the domain of sender must be at most 253 characters
                  rule: size(self.substring(self.indexOf('@') + 1)) <= 253
              serverRef:
                description: |-
                  ServerRef references the MailServer the application sends
                  through. Without a namespace it is a MailServer of the namespace
                  of the account. A MailServer of another namespace takes effect
                  only when that server lists the namespace of the account in
                  spec.serviceAccounts.allowedNamespaces. The server need not
                  exist yet.
                properties:
                  name:
                    description: Name of the referenced resource.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced resource. Defaults to the namespace
                      of the referencing resource.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
            required:
            - sender
            - serverRef
            type: object
          status:
            description: status defines the observed state of the MailServiceAccount
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the MailServiceAccount.
                  The "Ready" condition is true when the credential works.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the MailServiceAccount name must be at most 63 characters: it
            is a label value on the credential Secret and the NetworkPolicy'
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
