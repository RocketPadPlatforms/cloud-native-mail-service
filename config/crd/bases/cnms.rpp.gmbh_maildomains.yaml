---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: maildomains.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailDomain
    listKind: MailDomainList
    plural: maildomains
    singular: maildomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailDomain is the Schema for the cnms mail domains.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailDomain
            properties:
              dkim:
                description: DKIM signing configuration.
                properties:
                  ed25519:
                    description: |-
                      Ed25519 adds a second signature with an Ed25519 key (RFC 8463)
                      next to the RSA one. Receivers that do not know Ed25519 ignore
                      it. Defaults to false; not allowed together with keys.
                    type: boolean
                  keys:
                    description: |-
                      Keys lists your own keys by reference (bring your own keys, the
                      recommended production setup: the keys live in GitOps or an
                      external secret store). It replaces key generation. Rotate by
                      publishing the new key with signing false, waiting until the
                      status shows its record verified, flipping the signing flags in
                      one change and removing the old key after the overlap. Each
                      Secret value is a PEM (or base64) private key: RSA of at least
                      2048 bits or Ed25519.
                    items:
                      description: DKIMKey references one DKIM private key.
                      properties:
                        secretRef:
                          description: |-
                            SecretRef is the Secret key (same namespace) that holds the
                            private key.
                          properties:
                            key:
                              description: Key in the Secret data.
                              maxLength: 253
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              description: Name of the Secret.
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        selector:
                          description: |-
                            Selector of the key: a DNS label. The record is published at
                            `<selector>._domainkey.<domain>`.
                          maxLength: 63
                          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                          type: string
                        signing:
                          default: true
                          description: |-
                            Signing is true when the key signs outgoing mail. A key with
                            signing false is only published, so that receivers know it
                            before it takes over. Defaults to true.
                          type: boolean
                      required:
                      - secretRef
                      - selector
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - selector
                    x-kubernetes-list-type: map
                  rotation:
                    description: |-
                      Key rotation. When set, the operator rotates the generated keys
                      on the given interval and publishes the new selector with an
                      overlap so that both selectors stay valid during the switch.
                      Rotation progress (which keys are active, when a retiring key
                      ends) is recorded in the "cnms.rpp.gmbh/rotation" annotation on
                      the resource, because it must survive a restore without status.
                      Not allowed together with keys.
                    properties:
                      interval:
                        description: Interval after which the key is rotated. At least
                          24h.
                        maxLength: 32
                        type: string
                      overlap:
                        default: 120h0m0s
                        description: |-
                          Overlap during which the old and the new selector are both
                          valid. It has to cover the Postfix queue lifetime (5 days):
                          deferred mail is verified on delivery, possibly days after it was
                          signed. Defaults to 120h; must be shorter than the interval, so
                          an interval of 5 days or less needs an explicit overlap.
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: overlap must be positive
                          rule: duration(self) > duration('0s')
                    required:
                    - interval
                    type: object
                    x-kubernetes-validations:
                    - message: interval must be at least 24h and longer than the overlap
                        (default 120h); set overlap explicitly for an interval of
                        5 days or less
                      rule: duration(self.interval) >= duration('24h') && (!has(self.overlap)
                        || duration(self.overlap) < duration(self.interval))
                  selectorPrefix:
                    description: |-
                      Prefix of the selector names of generated keys. The RSA selector
                      is `<prefix>-<yyyymmdd>` and the Ed25519 selector
                      `<prefix>-ed25519-<yyyymmdd>`, the UTC date the key was created
                      (rotation is at most daily), so a rotation publishes a new
                      selector next to the old one. The selectors in use are reported
                      in status.dkim. Defaults to "cnms" when the operator generates
                      the keys; not allowed together with keys.
                    maxLength: 30
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'keys excludes rotation, ed25519 and selectorPrefix: with
                    your own keys you own the selectors and the schedule'
                  rule: '!has(self.keys) || !(has(self.rotation) || has(self.ed25519)
                    || has(self.selectorPrefix))'
                - message: at least one key must have signing set to true
                  rule: '!has(self.keys) || self.keys.exists(k, !has(k.signing) ||
                    k.signing)'
              dmarc:
                description: |-
                  DMARC policy. Records published by CNMS use DMARC1 semantics
                  (RFC 9989-9991).
                properties:
                  nonExistentSubdomainPolicy:
                    description: |-
                      Policy for non-existent subdomains (np, RFC 9989). Omitted by
                      default, so they follow subdomainPolicy, then policy.
                    enum:
                    - none
                    - quarantine
                    - reject
                    type: string
                  policy:
                    default: none
                    description: Enforcement policy. Defaults to "none".
                    enum:
                    - none
                    - quarantine
                    - reject
                    type: string
                  rua:
                    description: |-
                      Reporting address for aggregate reports (rua): a plain email
                      address without the "mailto:" scheme, which the renderer adds.
                      Characters that would end the URI or the tag (":", ";", ",", quotes,
                      "!", whitespace) are rejected.
                    maxLength: 254
                    pattern: ^[^\x00-\x20\x7f:;,"'!@<>?%\\]+@[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?)+$
                    type: string
                  ruf:
                    description: |-
                      Reporting address for failure reports (ruf): a plain email
                      address without the "mailto:" scheme, which the renderer adds.
                      Characters that would end the URI or the tag (":", ";", ",", quotes,
                      "!", whitespace) are rejected.
                    maxLength: 254
                    pattern: ^[^\x00-\x20\x7f:;,"'!@<>?%\\]+@[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?)+$
                    type: string
                  subdomainPolicy:
                    description: |-
                      Policy for existing subdomains (sp). Omitted by default, so the
                      subdomains follow policy.
                    enum:
                    - none
                    - quarantine
                    - reject
                    type: string
                  testing:
                    default: false
                    description: |-
                      Testing mode: publishes t=y (RFC 9989). Receivers that implement
                      it apply the policy one level lower (reject as quarantine,
                      quarantine as none); it has no effect on none. The Rspamd of the
                      data plane ignores t on the records of inbound mail (ADR 0012).
                      Defaults to false.
                    type: boolean
                type: object
              dnsMode:
                default: manual
                description: |-
                  DNS mode: "manual" (default) reports the required records in
                  the status for the operator to create; "externalDNS" creates
                  DNSEndpoint resources.
                enum:
                - manual
                - externalDNS
                type: string
              domain:
                description: |-
                  Domain name, e.g. "example.org". Lowercase DNS name with at
                  least two labels of up to 63 characters (A-labels only, no
                  trailing dot). The last label starts with a letter, so an IP
                  address is not a domain. The same rule applies to the name of a
                  MailDomainGrant; keep the two patterns in sync. Immutable:
                  DKIM keys, DNS records and the domain authorization belong to
                  one domain; create a new MailDomain for another one.
                maxLength: 253
                pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: domain is immutable; create a new MailDomain for another
                    domain
                  rule: self == oldSelf
              mtaSts:
                description: MTA-STS policy reporting. CNMS does not serve the policy.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Report the MTA-STS policy for this domain. Defaults to false.
                      MTA-STS is report-only: CNMS does not serve the policy. The
                      status holds the exact policy text, its id and the required
                      "_mta-sts" TXT record; the policy has to be served by the
                      operator of the domain at
                      `https://mta-sts.<domain>/.well-known/mta-sts.txt` with a valid
                      public certificate.
                    type: boolean
                  mode:
                    default: testing
                    description: |-
                      Mode of the reported policy: "testing" (default; senders report
                      failures but still deliver), "enforce" or "none".
                    enum:
                    - testing
                    - enforce
                    - none
                    type: string
                type: object
              spf:
                description: 'SPF record generation: the sending sources of the domain.'
                properties:
                  include:
                    description: |-
                      Domains whose SPF records are included (include: mechanisms), for
                      example the one of a mail provider. At most 5: SPF allows ten
                      DNS lookups in total (RFC 7208), and CNMS does not follow the
                      includes.
                    items:
                      maxLength: 253
                      pattern: ^([a-z0-9_]([a-z0-9_-]{0,61}[a-z0-9_])?[.])+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    maxItems: 5
                    type: array
                    x-kubernetes-list-type: set
                  ip4:
                    description: |-
                      IPv4 addresses or CIDR ranges allowed to send for the domain
                      (ip4: mechanisms).
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: every entry must be an IPv4 address or CIDR
                      rule: self.all(a, (isIP(a) && ip(a).family() == 4) || (isCIDR(a)
                        && cidr(a).ip().family() == 4))
                  ip6:
                    description: |-
                      IPv6 addresses or CIDR ranges allowed to send for the domain
                      (ip6: mechanisms).
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: every entry must be an IPv6 address or CIDR
                      rule: self.all(a, (isIP(a) && ip(a).family() == 6) || (isCIDR(a)
                        && cidr(a).ip().family() == 6))
                  qualifier:
                    default: softfail
                    description: |-
                      Result for senders not listed: "softfail" (~all, default), "fail"
                      (-all) or "neutral" (?all).
                    enum:
                    - softfail
                    - fail
                    - neutral
                    type: string
                type: object
              tlsRpt:
                description: TLS-RPT reporting.
                properties:
                  enabled:
                    default: false
                    description: Enable TLS-RPT for this domain. Defaults to false.
                    type: boolean
                  rua:
                    description: |-
                      Reporting address: a plain email address without the "mailto:"
                      scheme, which the renderer adds. Characters that would end the
                      URI or the tag (":", ";", ",", quotes, "!", whitespace) are
                      rejected. Defaults to the DMARC rua when set.
                    maxLength: 254
                    pattern: ^[^\x00-\x20\x7f:;,"'!@<>?%\\]+@[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?)+$
                    type: string
                type: object
            required:
            - domain
            type: object
            x-kubernetes-validations:
            - message: tlsRpt.enabled requires a report address in tlsRpt.rua or dmarc.rua
              rule: '!has(self.tlsRpt) || !has(self.tlsRpt.enabled) || !self.tlsRpt.enabled
                || has(self.tlsRpt.rua) || (has(self.dmarc) && has(self.dmarc.rua))'
          status:
            description: status defines the observed state of the MailDomain
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the MailDomain:
                  Authorized (the domain is granted to the namespace and unique),
                  DKIMKeysValid (every key is present and usable), DKIMRotation
                  (false while a new key waits for its DNS record),
                  RecordsVerified (a lookup found the required records),
                  DNSPublished (the DNSEndpoint is managed, externalDNS mode),
                  SPFReady (an SPF record can be generated), MTASTSReady (a policy
                  exists, when MTA-STS is enabled) and Ready. "Ready" is true when
                  the domain is authorized, the DKIM keys are valid and every
                  required record is verified.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dkim:
                description: DKIM reports the current signing state.
                properties:
                  active:
                    description: 'Active keys: the ones that sign, at most one per
                      algorithm.'
                    items:
                      description: DKIMKeyStatus describes one DKIM key.
                      properties:
                        algorithm:
                          description: Algorithm of the key.
                          enum:
                          - rsa
                          - ed25519
                          type: string
                        keyCreated:
                          description: |-
                            Creation time of the key. The age is derived from it, so status
                            does not change on every reconcile. Unset for your own keys.
                          format: date-time
                          type: string
                        selector:
                          description: Selector of the key.
                          maxLength: 63
                          type: string
                        until:
                          description: Time a retiring key leaves DNS. Set only for
                            retiring keys.
                          format: date-time
                          type: string
                      required:
                      - algorithm
                      - selector
                      type: object
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: atomic
                  nextRotation:
                    description: |-
                      Time the next generated key is created. Unset without rotation
                      and with your own keys.
                    format: date-time
                    type: string
                  pending:
                    description: 'Pending keys: published and waiting for a verified
                      record.'
                    items:
                      description: DKIMKeyStatus describes one DKIM key.
                      properties:
                        algorithm:
                          description: Algorithm of the key.
                          enum:
                          - rsa
                          - ed25519
                          type: string
                        keyCreated:
                          description: |-
                            Creation time of the key. The age is derived from it, so status
                            does not change on every reconcile. Unset for your own keys.
                          format: date-time
                          type: string
                        selector:
                          description: Selector of the key.
                          maxLength: 63
                          type: string
                        until:
                          description: Time a retiring key leaves DNS. Set only for
                            retiring keys.
                          format: date-time
                          type: string
                      required:
                      - algorithm
                      - selector
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                  retiring:
                    description: |-
                      Retiring keys: replaced by an active key, published until their
                      overlap ends.
                    items:
                      description: DKIMKeyStatus describes one DKIM key.
                      properties:
                        algorithm:
                          description: Algorithm of the key.
                          enum:
                          - rsa
                          - ed25519
                          type: string
                        keyCreated:
                          description: |-
                            Creation time of the key. The age is derived from it, so status
                            does not change on every reconcile. Unset for your own keys.
                          format: date-time
                          type: string
                        selector:
                          description: Selector of the key.
                          maxLength: 63
                          type: string
                        until:
                          description: Time a retiring key leaves DNS. Set only for
                            retiring keys.
                          format: date-time
                          type: string
                      required:
                      - algorithm
                      - selector
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              mtaSts:
                description: MTAStS reports the published policy state.
                properties:
                  policy:
                    description: Exact policy content to publish at the policy endpoint.
                    type: string
                  policyId:
                    description: |-
                      Policy id of the "_mta-sts" TXT record. It is derived from the
                      policy content (a truncated SHA-256), so it changes exactly
                      when the policy changes and can be re-derived without status.
                    maxLength: 32
                    pattern: ^[a-zA-Z0-9]+$
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
              records:
                description: |-
                  Records lists every DNS record required by this domain and
                  whether a lookup verified it. The list is atomic: neither the
                  name nor name and type identify a record, because one name can
                  hold several records of the same type (MX, A).
                items:
                  description: |-
                    DNSRecord is the desired state of one DNS record and its
                    verification state.
                  properties:
                    lastChecked:
                      description: LastChecked is the time of the last lookup.
                      format: date-time
                      type: string
                    name:
                      description: Fully qualified record name, e.g. "_dmarc.example.org".
                      maxLength: 253
                      type: string
                    type:
                      description: Record type (TXT, A, ...).
                      maxLength: 10
                      type: string
                    value:
                      description: Expected record value (full string for TXT records).
                      type: string
                    verified:
                      description: |-
                        Verified is true when the last lookup matched the expected
                        value.
                      type: boolean
                  required:
                  - name
                  - type
                  - value
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the MailDomain name must be at most 63 characters: it is a label
            value on the DKIM key Secrets, whose names (<name>-dkim-<selector>) then
            stay within 116 characters'
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
