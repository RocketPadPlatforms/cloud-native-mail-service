---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: maildomains.cnms.rpp.gmbh
spec:
  group: cnms.rpp.gmbh
  names:
    kind: MailDomain
    listKind: MailDomainList
    plural: maildomains
    singular: maildomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailDomain is the Schema for the cnms mail domains.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the MailDomain
            properties:
              dkim:
                description: DKIM signing configuration.
                properties:
                  rotation:
                    description: |-
                      Key rotation. When set, the operator rotates the key on the
                      given interval and publishes the new selector with an overlap
                      so that both selectors stay valid during the switch. Rotation
                      progress (schedule, start times) is recorded in the
                      "cnms.rpp.gmbh/rotation" annotation on the resource, because it
                      must survive a restore without status.
                    properties:
                      interval:
                        description: Interval after which the key is rotated.
                        type: string
                      overlap:
                        default: 24h0m0s
                        description: |-
                          Overlap during which the old and the new selector are both
                          valid. Defaults to 24h.
                        type: string
                    required:
                    - interval
                    type: object
                  selector:
                    default: cnms
                    description: Selector of the current signing key. Defaults to
                      "cnms".
                    maxLength: 30
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                type: object
              dmarc:
                description: |-
                  DMARC policy. Records published by CNMS use DMARC1 semantics
                  (RFC 9989-9991).
                properties:
                  policy:
                    default: none
                    description: Enforcement policy. Defaults to "none".
                    enum:
                    - none
                    - quarantine
                    - reject
                    type: string
                  rua:
                    description: Reporting address for aggregate reports (rua).
                    maxLength: 254
                    type: string
                  ruf:
                    description: Reporting address for failure reports (ruf).
                    maxLength: 254
                    type: string
                  testing:
                    default: false
                    description: |-
                      Testing mode: the t= tag is set, so policies are evaluated but
                      not enforced. Defaults to false.
                    type: boolean
                type: object
              dnsMode:
                default: manual
                description: |-
                  DNS mode: "manual" (default) reports the required records in
                  the status for the operator to create; "externalDNS" creates
                  DNSEndpoint resources.
                enum:
                - manual
                - externalDNS
                type: string
              domain:
                description: |-
                  Domain name, e.g. "example.org". Lowercase DNS name with at
                  least two labels (A-labels only, no trailing dot).
                maxLength: 253
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
                type: string
              mtaSts:
                description: MTA-STS policy publication.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Publish an MTA-STS policy for this domain. Defaults to false.
                      The policy endpoint (`https://mta-sts.<domain>/.well-known/
                      mta-sts.txt`) is served by the CNMS policy server and requires a
                      valid public certificate for the domain.
                    type: boolean
                type: object
              tlsRpt:
                description: TLS-RPT reporting.
                properties:
                  enabled:
                    default: false
                    description: Enable TLS-RPT for this domain. Defaults to false.
                    type: boolean
                  rua:
                    description: Reporting address. Defaults to the DMARC rua when
                      set.
                    maxLength: 254
                    type: string
                type: object
            required:
            - domain
            type: object
          status:
            description: status defines the observed state of the MailDomain
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the MailDomain. The
                  "Ready" condition is true when the required records are
                  published and verified.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dkim:
                description: DKIM reports the current signing state.
                properties:
                  keyAge:
                    description: Age of the active key.
                    type: string
                  pendingSelector:
                    description: Selector of the key being rolled in, during an overlap.
                    type: string
                  selector:
                    description: Selector of the active key.
                    type: string
                type: object
              mtaSts:
                description: MTAStS reports the published policy state.
                properties:
                  policy:
                    description: Exact policy content to publish at the policy endpoint.
                    type: string
                  policyId:
                    description: |-
                      Monotonically increasing policy id. It changes whenever the
                      policy content changes.
                    format: int64
                    type: integer
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  applied.
                format: int64
                type: integer
              records:
                description: |-
                  Records lists every DNS record required by this domain and
                  whether a lookup verified it.
                items:
                  description: |-
                    DNSRecord is the desired state of one DNS record and its
                    verification state.
                  properties:
                    lastChecked:
                      description: LastChecked is the time of the last lookup.
                      format: date-time
                      type: string
                    name:
                      description: Fully qualified record name, e.g. "_dmarc.example.org".
                      maxLength: 253
                      type: string
                    type:
                      description: Record type (TXT, A, ...).
                      maxLength: 10
                      type: string
                    value:
                      description: Expected record value (full string for TXT records).
                      type: string
                    verified:
                      description: |-
                        Verified is true when the last lookup matched the expected
                        value.
                      type: boolean
                  required:
                  - name
                  - type
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
