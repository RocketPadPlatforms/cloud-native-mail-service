# The sending credential of an application. Apply it into the namespace of
# the application (example-app), not into the one of the MailServer: it is
# not part of the kustomization for that reason. The MailServer of
# cnms_v1alpha1_mailserver.yaml consents to the namespace example-app in
# spec.serviceAccounts.allowedNamespaces.
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: notifications
spec:
  # The MailServer the application sends through. Without a namespace it
  # is a MailServer of the namespace of the account; another namespace
  # needs the consent of the server.
  serverRef:
    name: mailserver-sample
    namespace: mail-sample
  # The one address the application may send as. Its domain must be served
  # by the server, authorized for it and, for a server that limits the
  # namespace with senderDomains, listed there.
  sender: notifications@example.org
# The operator makes the Secret notifications-credential and the NetworkPolicy
# notifications-submission in this namespace. Label the pods of the
# application that send mail with
# cnms.rpp.gmbh/mailserviceaccount: notifications; the policy applies to them
# only, and isolates them (see the how-to guide).
