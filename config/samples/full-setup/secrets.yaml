# DRAFT: part of a complete example scenario, not an agreed reference.
# The Secrets referenced by corp-ldap and by the DKIM keys of example-net.
# The values are placeholders: replace them, or better, create these
# Secrets from your secret store (SOPS, sealed secrets, external secrets)
# instead of committing them.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mail-ldap-bind
type: Opaque
stringData:
  # Password of the bind DN cn=lookup,ou=services,dc=example,dc=com.
  password: REPLACE-WITH-THE-BIND-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mail-ldap-ca
type: Opaque
stringData:
  # CA bundle that signed the LDAP server certificate.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-THE-PEM-ENCODED-CA-BUNDLE
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: example-net-dkim
type: Opaque
stringData:
  # DKIM signing key of example-net: an RSA key of at least 2048 bits or
  # an Ed25519 key in PEM form.
  s2026a.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-THE-PEM-ENCODED-SIGNING-KEY
    -----END PRIVATE KEY-----
