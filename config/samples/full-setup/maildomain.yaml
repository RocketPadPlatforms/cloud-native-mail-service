# DRAFT: part of a complete example scenario, not an agreed reference.
# Two domains served by one MailServer (serverRef). dnsMode manual: the required DNS
# records are listed in each MailDomain's status for you to create at
# your DNS host. example.com uses generated keys (RSA plus an Ed25519
# second signature); example.net brings its own keys (secrets.yaml).
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomain
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: example-com
spec:
  domain: example.com
  serverRef:
    name: mail
  dnsMode: manual
  dkim:
    selectorPrefix: cnms
    ed25519: true
    rotation:
      interval: 2160h
      # The default overlap is 120h (the Postfix queue lifetime).
  # The sending sources of the server (spec.spf of the MailServer) are
  # listed in the SPF record as well.
  spf:
    include:
      - _spf.example.com
  dmarc:
    policy: quarantine
    subdomainPolicy: quarantine
    rua: dmarc-feedback@example.com
    testing: true
  mtaSts:
    enabled: false
  tlsRpt:
    enabled: true
    rua: tls-rpt@example.com
---
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomain
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: example-net
spec:
  domain: example.net
  serverRef:
    name: mail
  dnsMode: manual
  dkim:
    keys:
      - selector: s2026a
        secretRef:
          name: example-net-dkim
          key: s2026a.key
  dmarc:
    policy: none
    rua: dmarc-feedback@example.net
