# DRAFT: part of a complete example scenario, not an agreed reference.
# MailDomainGrants are cluster-scoped and admin-owned: the platform admin
# names the tenant namespace allowed to use each domain. The object name
# is the domain itself. Replace spec.namespace with the namespace you
# apply the other files into (kubectl ignores -n for this object).
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomainGrant
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: example.com
spec:
  namespace: mail-full-setup
  # Also covers subdomains such as mail.example.com.
  includeSubdomains: true
---
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomainGrant
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: example.net
spec:
  namespace: mail-full-setup
