## Append samples of your project ##
# The samples carry no namespace: apply them into the namespace the grant
# names (spec.namespace of cnms_v1alpha1_maildomaingrant.yaml, which is
# cluster-scoped and ignores -n):
#   kubectl create namespace mail-sample
#   kubectl apply -n mail-sample -k config/samples
# The static-users test samples (cnms_v1alpha1_mailserver-static-users.yaml
# and cnms_v1alpha1_sample-static-users.yaml) are not listed here: they need
# the operator flag --enable-insecure-test-features and replace the
# MailDirectory of cnms_v1alpha1_mailserver.yaml.
# The PostgreSQL directory cnms_v1alpha1_maildirectory-sql.yaml is an
# alternative to cnms_v1alpha1_maildirectory.yaml and is not listed either.
# The MailDomain variants cnms_v1alpha1_maildomain-byo-keys.yaml and
# cnms_v1alpha1_maildomain-ed25519.yaml claim the same domain as
# cnms_v1alpha1_maildomain.yaml and are not listed here either.
# The draft scenario in full-setup/ is a separate kustomization (names and
# domains differ from the samples above, so both can be applied):
#   kubectl create namespace mail-full-setup
#   kubectl apply -n mail-full-setup -k config/samples/full-setup
resources:
- cnms_v1alpha1_mailserver.yaml
- cnms_v1alpha1_maildomain.yaml
- cnms_v1alpha1_maildirectory.yaml
- cnms_v1alpha1_maildomaingrant.yaml
- cnms_v1alpha1_maildomaingrant-hostname.yaml
# +kubebuilder:scaffold:manifestskustomizesamples
