# Test-only MailServer: its users come from the Secret in
# cnms_v1alpha1_sample-static-users.yaml instead of a MailDirectory. The
# operator accepts spec.submission.insecureStaticUsers only when it runs
# with --enable-insecure-test-features. A domain belongs to one server,
# so it brings its own MailDomain and MailDomainGrant (static.example.org)
# next to the ones of cnms_v1alpha1_mailserver.yaml. It is not part of
# kustomization.yaml; apply it and the Secret with
# `kubectl apply -n mail-sample -f <file>`. The hostname needs a grant of its
# own as well (mail.static.example.org below).
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailServer
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mailserver-static-users-sample
spec:
  hostname: mail.static.example.org
  outbound:
    direct: {}
  tls:
    issuerRef:
      kind: Issuer
      name: selfsigned-issuer
  submission:
    enabled: true
    insecureStaticUsers:
      secretName: sample-static-users
  mailboxes:
    enabled: true
    storage: 10Gi
---
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomain
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: maildomain-static-users-sample
spec:
  domain: static.example.org
  serverRef:
    name: mailserver-static-users-sample
---
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomainGrant
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  # The object name is the domain itself; the namespace is the one you
  # apply the samples into.
  name: static.example.org
spec:
  namespace: mail-sample
---
apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomainGrant
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mail.static.example.org
spec:
  namespace: mail-sample
