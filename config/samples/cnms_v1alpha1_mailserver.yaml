apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailServer
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mailserver-sample
spec:
  # The name the server presents (HELO, certificate, MX target). It needs
  # its own grant, see cnms_v1alpha1_maildomaingrant-hostname.yaml, and
  # an A record to the address of the inbound Service.
  hostname: mail.example.org
  # Sending sources of the server, added to the SPF record of its domains
  # and of the hostname.
  spf:
    ip4:
      - 203.0.113.0/24
    ip6:
      - 2001:db8::/32
  directoryRef:
    name: maildirectory-sample
  outbound:
    direct: {}
  tls:
    issuerRef:
      kind: Issuer
      name: selfsigned-issuer
  inbound:
    serviceType: LoadBalancer
    externalTrafficPolicy: Local
  submission:
    enabled: true
  mailboxes:
    enabled: true
    storage: 10Gi
  postfix:
    replicas: 2
    queueStorage: 1Gi
  rspamd:
    replicas: 2
  valkey:
    persistence: false
  availability:
    postfixMinAvailable: 1
  observability:
    prometheusOperator: auto
  backup:
    enabled: true
