apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailServer
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: mailserver-sample
spec:
  directoryRef:
    name: maildirectory-sample
  outbound:
    direct: {}
  domains:
    - name: maildomain-sample
  tls:
    issuerRef:
      kind: Issuer
      name: selfsigned-issuer
  inbound:
    serviceType: LoadBalancer
    externalTrafficPolicy: Local
  submission:
    enabled: true
    insecureStaticUsers:
      secretName: sample-static-users
  mailboxes:
    enabled: true
    storage: 10Gi
  postfix:
    replicas: 2
    queueStorage: 1Gi
  rspamd:
    replicas: 2
  valkey:
    persistence: false
  availability:
    postfixMinAvailable: 1
  observability:
    prometheusOperator: auto
  backup:
    enabled: true
