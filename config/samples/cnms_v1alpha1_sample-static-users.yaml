kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: sample-static-users
  namespace: mail-sample
type: Opaque
stringData:
  users.yaml: |
    users:
