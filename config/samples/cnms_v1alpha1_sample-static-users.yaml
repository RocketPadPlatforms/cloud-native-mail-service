        passwordHash: '$6$cnmsamplesalt$1J78sPZnakgEEUQSuB.sREgwYv3CA/gw7LT8ncmeEe7/tpdNEiCAYxdMyYOIVB788Iws9QXMDc8LmiW7G6RzB1'
        mailbox: testuser@example.org
