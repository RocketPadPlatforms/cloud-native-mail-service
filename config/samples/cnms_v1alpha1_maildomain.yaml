apiVersion: cnms.rpp.gmbh/v1alpha1
kind: MailDomain
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: maildomain-sample
spec:
  domain: example.org
  dnsMode: manual
  dkim:
    selector: cnms
    rotation:
      interval: 2160h
      overlap: 24h
  dmarc:
    policy: none
    rua: dmarc-feedback@example.org
    testing: true
  mtaSts:
    enabled: false
  tlsRpt:
    enabled: true
    rua: tls-rpt@example.org
