---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cnms.rpp.gmbh
  resources:
  - maildirectories
  - maildomaingrants
  - maildomains
  - mailservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cnms.rpp.gmbh
  resources:
  - maildirectories/finalizers
  - maildomaingrants/finalizers
  - maildomains/finalizers
  - mailservers/finalizers
  verbs:
  - update
- apiGroups:
  - cnms.rpp.gmbh
  resources:
  - maildirectories/status
  - maildomaingrants/status
  - maildomains/status
  - mailservers/status
  verbs:
  - get
  - patch
  - update
