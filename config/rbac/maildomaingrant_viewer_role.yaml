# This rule is not used by the project cloud-native-mail-service itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cnms.rpp.gmbh resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-mail-service
    app.kubernetes.io/managed-by: kustomize
  name: maildomaingrant-viewer-role
rules:
- apiGroups:
  - cnms.rpp.gmbh
  resources:
  - maildomaingrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cnms.rpp.gmbh
  resources:
  - maildomaingrants/status
  verbs:
  - get
