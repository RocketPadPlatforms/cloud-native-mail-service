name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: "Run e2e tests on kind (prometheus CRDs: ${{ matrix.prometheus-crds }})"
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PROMETHEUS_CRDS=1 installs a minimal ServiceMonitor CRD so
        # the optional Prometheus Operator integration is exercised.
        prometheus-crds: ["0", "1"]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The checksum is the linux-amd64 asset of the release; update it
      # together with the version (kind-linux-amd64.sha256sum).
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        env:
          PROMETHEUS_CRDS: ${{ matrix.prometheus-crds }}
        run: make test-e2e
