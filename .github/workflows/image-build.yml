name: Build image

# Called by images.yml. The permissions of the job come from the caller:
# pull requests only build; publishing needs packages: write.
on:
  workflow_call:
    inputs:
      image:
        description: Image name below ghcr.io/rocketpadplatforms
        type: string
        required: true
      context:
        description: Build context, which holds the Dockerfile
        type: string
        required: true
      push:
        description: Push the image to ghcr.io
        type: boolean
        required: true
      postfix-tag:
        description: Also tag the image with the Postfix version
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    # The Postfix build compiles from source under emulation for arm64.
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Postfix version
        id: postfix
        run: echo "version=$(sed -n 's/^ARG POSTFIX_VERSION=//p' images/postfix/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rocketpadplatforms/${{ inputs.image }}
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=${{ steps.postfix.outputs.version }},enable=${{ inputs.postfix-tag }}

      # sbom and provenance attach an SBOM and a build attestation to the
      # published image index.
      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
